# ─────────────────────────────────────────────────────────────────────────────
# CD — Deploy Contínuo
# Dispara em: push na branch main (após merge de PR)
# Objetivo: Buildar imagens Docker, publicar no GHCR e fazer deploy na VPS via SSH
#
# Secrets necessários no GitHub (Settings → Secrets and variables → Actions):
#   GHCR_TOKEN        → Personal Access Token com permissão packages:write
#   VPS_HOST          → IP ou hostname da VPS
#   VPS_USER          → Usuário SSH da VPS (ex: ubuntu)
#   VPS_SSH_KEY       → Chave privada SSH (conteúdo do arquivo id_rsa)
#   VPS_DEPLOY_PATH   → Caminho do projeto na VPS (ex: /opt/setoriza)
# ─────────────────────────────────────────────────────────────────────────────

name: 🚀 CD — Release & Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/setoriza

jobs:
  # ─── Build & Push imagens Docker ──────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair versão da tag (ou usar commit SHA)
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Auth-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-auth-service:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Ticket-service
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/ticket-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ticket-service:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-ticket-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Gateway-service
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Gateway-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-gateway-service:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-gateway-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy na VPS via SSH ────────────────────────────────────────────────
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    # só deploya se for uma tag de versão (ex: v1.0.0) ou push direto na main
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Extrair versão
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "📦 Navegando para o diretório do projeto..."
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "🔑 Autenticando no GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "⬇️  Baixando novas imagens..."
            APP_VERSION=${{ steps.version.outputs.tag }} docker compose -f Backend/docker-compose.prod.yml pull

            echo "♻️  Reiniciando serviços com zero-downtime..."
            APP_VERSION=${{ steps.version.outputs.tag }} docker compose -f Backend/docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Deploy concluído! Versão: ${{ steps.version.outputs.tag }}"
