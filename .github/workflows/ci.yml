# ─────────────────────────────────────────────────────────────────────────────
# CI — Integração Contínua
# Dispara em: pull_requests para main e develop
# Objetivo: Compilar e validar todos os serviços antes do merge
# ─────────────────────────────────────────────────────────────────────────────

name: 🔍 CI — Build & Validate

on:
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Frontend ──────────────────────────────────────────────────────────────
  ci-frontend:
    name: Frontend (Node / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build production bundle
        run: npm run build

  # ─── Auth Service ──────────────────────────────────────────────────────────
  ci-auth-service:
    name: Auth-service (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Auth-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build & Test
        run: mvn clean verify -q

  # ─── Ticket Service ────────────────────────────────────────────────────────
  ci-ticket-service:
    name: Ticket-service (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/ticket-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build & Test
        run: mvn clean verify -q

  # ─── Gateway Service ───────────────────────────────────────────────────────
  ci-gateway-service:
    name: Gateway-service (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Gateway-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build & Test
        run: mvn clean verify -q

  # ─── Docker Build Validation ───────────────────────────────────────────────
  ci-docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [ci-frontend, ci-auth-service, ci-ticket-service, ci-gateway-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image (sem push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: setoriza/frontend:ci

      - name: Build Auth-service image (sem push)
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Auth-service
          push: false
          tags: setoriza/auth-service:ci

      - name: Build Ticket-service image (sem push)
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/ticket-service
          push: false
          tags: setoriza/ticket-service:ci

      - name: Build Gateway-service image (sem push)
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Gateway-service
          push: false
          tags: setoriza/gateway-service:ci
