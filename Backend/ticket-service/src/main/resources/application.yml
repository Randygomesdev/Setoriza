server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ticket-service

  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    url: ${TICKET_DB_URL:jdbc:postgresql://localhost:5432/ticket_db}
    username: ${TICKET_DB_USERNAME:postgres}
    password: ${TICKET_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    baseline-on-migrate: true

aws:
  s3:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:setoriza-medias}

whatsapp:
  evolution:
    url: ${EVOLUTION_URL:http://localhost:8085}
    apikey: ${EVOLUTION_APIKEY:setoriza_api_key_12345}

jwt:
  secret: ${JWT_SECRET:sua_chave_secreta_minimo_256_bits}
