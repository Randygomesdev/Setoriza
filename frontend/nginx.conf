server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para ativos estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache longo para ativos com hash (JS/CSS buildados pelo Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todas as rotas redirecionadas para index.html (React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança: não expor versão do nginx
    server_tokens off;
}
